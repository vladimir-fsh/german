name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check application
        run: |
          node --test tools/test-regressions.js tools/test-openai.js tools/test-swipe-back.js
          node tools/test-sync.js
          node tools/test-lessons.js
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html icon-180.png _site/
          cp -R css js data _site/
          touch _site/.nojekyll
          python3 tools/stamp-pages.py _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
